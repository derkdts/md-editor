<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Редактор</title>
    <!-- Отключаем ошибку 404 для favicon -->
    <link rel="icon" href="data:,">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
        }
        .container {
            display: flex;
            gap: 20px;
            height: 70vh;
        }
        textarea, .preview-area {
            flex: 1;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            resize: none;
            background: #fff;
            overflow-y: auto;
        }
        .preview-area {
            background-color: #fff;
        }
        .button-zone {
            margin-top: 15px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>Markdown Редактор</h1>
    
    <div class="container">
        <!-- Поле ввода текста -->
        <textarea id="markdown-input" placeholder="Введите ваш Markdown текст здесь..."></textarea>
        
        <!-- Поле предпросмотра -->
        <div id="preview" class="preview-area"></div>
    </div>

    <div class="button-zone">
        <!-- Кнопка копирования -->
        <button id="copy-btn">Скопировать текст в буфер</button>
    </div>

    <!-- 1. ПОДКЛЮЧЕНИЕ БИБЛИОТЕКИ (Укажите имя файла, который вы достали из папки lib/) -->
    <script src="script.js"></script>

    <!-- 2. ЛОГИКА ПРИЛОЖЕНИЯ -->
    <script>
        const textarea = document.getElementById('markdown-input');
        const preview = document.getElementById('preview');
        const copyButton = document.getElementById('copy-btn');

        // Функция обновления предпросмотра при вводе текста
        function updatePreview() {
            const rawText = textarea.value;
            
            // Проверяем, загрузилась ли библиотека marked
            if (typeof marked !== 'undefined') {
                // Используем правильный современный синтаксис marked.parse
                preview.innerHTML = marked.parse(rawText);
            } else {
                preview.innerHTML = "<span style='color:red;'>Ошибка: библиотека marked не подключена локально. Положите файл marked.umd.js в папку с этим проектом.</span>";
            }
        }

        // Функция копирования исходного Markdown текста в буфер обмена
        function copyMarkdownToClipboard() {
            const textToCopy = textarea.value.trim();

            if (!textToCopy) {
                alert('Поле ввода пустое. Напишите что-нибудь перед копированием!');
                return;
            }

            // Используем современное Clipboard API
            navigator.clipboard.writeText(textToCopy)
                .then(() => {
                    alert('Исходный Markdown текст успешно скопирован в буфер обмена!');
                })
                .catch(err => {
                    console.error('Не удалось скопировать: ', err);
                    alert('Ошибка при копировании. Проверьте разрешения браузера.');
                });
        }

        // Навешиваем обработчики событий
        textarea.addEventListener('input', updatePreview);
        copyButton.addEventListener('click', copyMarkdownToClipboard);

        // Инициализируем пустой предпросмотр при старте страницы
        updatePreview();
    </script>
</body>
</html>

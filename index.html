<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Редактор для Telegram</title>
    
    <!-- Библиотека для предпросмотра Markdown -->
    <script src="script.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f5f5f5;
        }
        header {
            background-color: #24292e;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .config-inputs {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .config-inputs input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            width: 180px;
        }
        .btn {
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn-save {
            background-color: #28a745;
            color: white;
        }
        .btn-save:hover {
            background-color: #218838;
        }
        .btn-clear {
            background-color: #dc3545;
            color: white;
        }
        .btn-clear:hover {
            background-color: #bd2130;
        }
        .editor-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        textarea, .preview {
            width: 50%;
            height: 100%;
            padding: 20px;
            font-size: 16px;
            overflow-y: auto;
            border: none;
        }
        textarea {
            resize: none;
            background-color: #ffffff;
            border-right: 1px solid #e1e4e8;
            font-family: 'Courier New', Courier, monospace;
            outline: none;
        }
        .preview {
            background-color: #fafbfc;
        }
        /* Стили для предпросмотра */
        .preview h1, .preview h2, .preview h3 { margin-bottom: 12px; margin-top: 10px; }
        .preview p { margin-bottom: 12px; line-height: 1.6; }
        .preview ul, .preview ol { margin-left: 20px; margin-bottom: 12px; }
        .preview code { background: #e1e4e8; padding: 2px 6px; border-radius: 3px; font-family: monospace; }
        .preview pre { background: #e1e4e8; padding: 10px; border-radius: 5px; margin-bottom: 12px; overflow-x: auto; }
        .preview pre code { background: none; padding: 0; }
    </style>
</head>
<body>

    <header>
        <h2>MD в Telegram</h2>
        <div class="config-inputs">
            <input type="password" id="botToken" placeholder="Токен бота">
            <input type="text" id="chatId" placeholder="ID чата (-100...)">
            <button class="btn btn-clear" onclick="clearText()">Очистить текст</button>
            <button class="btn btn-save" onclick="sendToTelegram()">Отправить в TG</button>
        </div>
    </header>

    <div class="editor-container">
        <!-- Поле ввода текста -->
        <textarea id="markdownInput" placeholder="Пишите Markdown здесь...&#10;&#10;# Заголовок&#10;**Жирный текст**&#10;- Список 1&#10;- Список 2"></textarea>
        
        <!-- Окно предпросмотра -->
        <div id="htmlPreview" class="preview"></div>
    </div>

    <script>
        const markdownInput = document.getElementById('markdownInput');
        const htmlPreview = document.getElementById('htmlPreview');
        const botTokenInput = document.getElementById('botToken');
        const chatIdInput = document.getElementById('chatId');

        // 1. Загрузка данных при открытии страницы (Настройки + Черновик текста)
        window.addEventListener('DOMContentLoaded', () => {
            const savedToken = localStorage.getItem('tg_bot_token');
            const savedChatId = localStorage.getItem('tg_chat_id');
            const savedText = localStorage.getItem('tg_draft_text');

            if (savedToken) botTokenInput.value = savedToken;
            if (savedChatId) chatIdInput.value = savedChatId;
            
            if (savedText) {
                markdownInput.value = savedText;
                updatePreview(savedText); // Обновляем правое окно, если текст был сохранен
            }
        });

        // Функция для обновления HTML-предпросмотра
        function updatePreview(text) {
            htmlPreview.innerHTML = marked.parse(text);
        }

        // 2. Живой предпросмотр + автосохранение каждой буквы
        markdownInput.addEventListener('input', () => {
            const currentText = markdownInput.value;
            updatePreview(currentText);
            
            // Сохраняем черновик в память браузера автоматически
            localStorage.setItem('tg_draft_text', currentText);
        });

        // 3. Функция очистки текста
        function clearText() {
            if (confirm('Вы уверены, что хотите полностью стереть текущий текст?')) {
                markdownInput.value = '';
                htmlPreview.innerHTML = '';
                localStorage.removeItem('tg_draft_text'); // Удаляем черновик из памяти
            }
        }

        // 4. Функция отправки Markdown в Telegram
        async function sendToTelegram() {
            const token = botTokenInput.value.trim();
            const chatId = chatIdInput.value.trim();
            const text = markdownInput.value.trim();

            if (!token || !chatId || !text) {
                alert('Пожалуйста, заполните настройки и напишите текст!');
                return;
            }

            // Сохраняем токен и ID чата, чтобы не вводить заново
            localStorage.setItem('tg_bot_token', token);
            localStorage.setItem('tg_chat_id', chatId);

            const url = `https://telegram.org{token}/sendMessage`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: text,
                        parse_mode: 'MarkdownV2' // Режим разметки Markdown v2
                    })
                });

                const data = await response.json();

                if (data.ok) {
                    alert('Успешно отправлено в Telegram!');
                } else {
                    alert('Ошибка Telegram: ' + data.description + '\n\nПодсказка: В MarkdownV2 символы . ! - ( ) в обычном тексте нужно экранировать через косую черту: \\. \\! \\-');
                }
            } catch (error) {
                console.error(error);
                alert('Сбой сети. Проверьте подключение к интернету.');
            }
        }
    </script>
</body>
</html>
